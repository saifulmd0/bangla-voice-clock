name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-macos:
    name: Build macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Make disk image
        run: |
          # The app beside an Applications shortcut, to drag it onto.
          mkdir dmg
          cp -R "build/macos/Build/Products/Release/Bangla Voice Clock.app" dmg/
          brew install --quiet create-dmg
          # create-dmg lays out the window through Finder, which a CI
          # machine sometimes refuses; a plain image works the same.
          create-dmg --volname "Bangla Voice Clock" \
              --window-size 540 360 --icon-size 112 \
              --icon "Bangla Voice Clock.app" 140 170 \
              --app-drop-link 400 170 --hide-extension "Bangla Voice Clock.app" \
              --no-internet-enable \
              BanglaVoiceClock-macos.dmg dmg/ \
            || { rm -f BanglaVoiceClock-macos.dmg
                 ln -s /Applications dmg/Applications
                 hdiutil create -volname "Bangla Voice Clock" -srcfolder dmg \
                     -format UDZO -ov BanglaVoiceClock-macos.dmg; }
      - uses: actions/upload-artifact@v7
        with:
          name: BanglaVoiceClock-macos
          path: BanglaVoiceClock-macos.dmg
          retention-days: 14

  build-windows:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip app folder
        shell: pwsh
        run: |
          $app = "Bangla Voice Clock"
          New-Item -ItemType Directory -Path $app | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* $app
          # The Visual C++ runtime Flutter needs, for PCs that lack it
          # (Microsoft allows redistributing these files).
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:SystemRoot\System32\$dll" $app
          }
          Compress-Archive -Path $app -DestinationPath BanglaVoiceClock-windows-portable.zip
      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSourceDir=$PWD\Bangla Voice Clock" "/DOutputDir=$PWD" windows\installer\BanglaVoiceClock.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: BanglaVoiceClock-windows
          path: |
            BanglaVoiceClock-windows-setup.exe
            BanglaVoiceClock-windows-portable.zip
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for f in BanglaVoiceClock-*; do mv "$f" "${f/BanglaVoiceClock-/BanglaVoiceClock-${TAG}-}"; done
          # 0.x versions are pre-releases.
          prerelease=""
          case "$TAG" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" BanglaVoiceClock-${TAG}-* \
            --title "Bangla Voice Clock ${TAG#v}" \
            --notes-file ".github/release-notes/${TAG}.md" $prerelease
